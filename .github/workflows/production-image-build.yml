name: Production Image Build

on:
  pull_request:
    branches:
      - main
  workflow_run:
    workflows:
      - Quality CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: production-image-build-${{ github.event.pull_request.number || github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  deployment-contract-check:
    name: Production deployment contract check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Production preflight ellenőrzése
        shell: bash
        run: |
          set -euo pipefail

          valid_env="${RUNNER_TEMP}/btphoto-production-valid.env"
          invalid_env="${RUNNER_TEMP}/btphoto-production-invalid.env"
          resolved_config="${RUNNER_TEMP}/btphoto-production-compose.json"
          fixture_root="${RUNNER_TEMP}/btphoto-production-fixtures"
          trap 'rm -rf "${fixture_root}"; rm -f "${valid_env}" "${invalid_env}" "${resolved_config}"' EXIT

          write_env() {
            local target_file=$1
            local image_tag=$2

            printf '%s\n' \
              "BTPHOTO_IMAGE_TAG=${image_tag}" \
              'DB_HOST=db.internal.example' \
              'DB_PORT=26257' \
              'DB_NAME=btphoto' \
              'DB_USERNAME=btphoto_app' \
              'DB_PASSWORD=ci-dummy-not-production' \
              > "${target_file}"
          }

          valid_sha='0123456789abcdef0123456789abcdef01234567'
          write_env "${valid_env}" "${valid_sha}"
          sh deploy/validate-production-config.sh "${valid_env}"

          docker compose \
            --env-file "${valid_env}" \
            -f deploy/compose.production.yml \
            config --format json > "${resolved_config}"

          python3 - "${resolved_config}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as config_file:
              config = json.load(config_file)

          services = config["services"]
          migrations = services["migrations"]
          backend = services["backend"]
          frontend = services["frontend"]
          caddy = services["caddy"]

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          require("ALL" in backend.get("cap_drop", []),
                  "A backend cap_drop listájából hiányzik az ALL.")
          require(not backend.get("cap_add"),
                  "A backend nem kaphat hozzáadott capabilityt.")
          require(migrations.get("cap_drop") == ["ALL"],
                  "A migrations cap_drop értéke nem pontosan ALL.")
          require(not migrations.get("cap_add"),
                  "A migrations nem kaphat hozzáadott capabilityt.")

          for name, service in (("frontend", frontend), ("caddy", caddy)):
              require(service.get("cap_drop") == ["ALL"],
                      f"A {name} cap_drop értéke nem pontosan ALL.")
              require(service.get("cap_add") == ["NET_BIND_SERVICE"],
                      f"A {name} cap_add értéke nem pontosan NET_BIND_SERVICE.")

          for name, service in services.items():
              require(service.get("read_only") is True,
                      f"A {name} read_only védelme hiányzik.")
              require("no-new-privileges:true" in service.get("security_opt", []),
                      f"A {name} no-new-privileges védelme hiányzik.")

          require(not backend.get("ports"),
                  "A backend nem publikálhat hostportot.")
          require(not frontend.get("ports"),
                  "A frontend nem publikálhat hostportot.")
          require(not migrations.get("ports"),
                  "A migrations nem publikálhat hostportot.")

          migration_networks = set((migrations.get("networks") or {}).keys())
          require(migration_networks == {"application"},
                  "A migrations csak az application hálózathoz csatlakozhat.")
          dependency = (backend.get("depends_on") or {}).get("migrations") or {}
          require(dependency.get("condition") == "service_completed_successfully",
                  "A backend nem várja meg a migrations sikeres befejezését.")

          ports = caddy.get("ports", [])
          require(len(ports) == 1,
                  "A gateway pontosan egy hostportot publikálhat.")
          gateway_port = ports[0]
          require(gateway_port.get("host_ip") == "127.0.0.1",
                  "A gateway host IP-címe nem 127.0.0.1.")
          require(str(gateway_port.get("published")) == "8080",
                  "A gateway publikált portja nem 8080.")
          require(gateway_port.get("target") == 8080,
                  "A gateway konténerportja nem 8080.")
          require(gateway_port.get("protocol") == "tcp",
                  "A gateway portprotokollja nem TCP.")
          PY

          for invalid_tag in \
            latest \
            abc \
            ABCDEF0123456789ABCDEF0123456789ABCDEF01 \
            0123456789abcdef0123456789abcdef0123456 \
            0123456789abcdef0123456789abcdef012345678; do
            write_env "${invalid_env}" "${invalid_tag}"
            if sh deploy/validate-production-config.sh "${invalid_env}"; then
              echo "::error::A production preflight elfogadott egy érvénytelen image taget."
              exit 1
            fi
          done

          mkdir -p "${fixture_root}/mismatched" "${fixture_root}/missing"
          for fixture in mismatched missing; do
            cp deploy/validate-production-config.sh "${fixture_root}/${fixture}/"
            cp deploy/compose.production.yml "${fixture_root}/${fixture}/"
          done

          python3 - "${fixture_root}/mismatched/compose.production.yml" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          old = "    image: ghcr.io/balintbotond89/btphoto-migrations:${BTPHOTO_IMAGE_TAG:?BTPHOTO_IMAGE_TAG must be a full 40-character commit SHA}"
          new = "    image: ghcr.io/balintbotond89/btphoto-migrations:89abcdef0123456789abcdef0123456789abcdef"
          if text.count(old) != 1:
              raise SystemExit("A migrations image fixture nem készíthető el.")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          python3 - "${fixture_root}/missing/compose.production.yml" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          image_line = "    image: ghcr.io/balintbotond89/btphoto-migrations:${BTPHOTO_IMAGE_TAG:?BTPHOTO_IMAGE_TAG must be a full 40-character commit SHA}\n"
          if text.count(image_line) != 1:
              raise SystemExit("A hiányzó migrations image fixture nem készíthető el.")
          path.write_text(text.replace(image_line, ""), encoding="utf-8")
          PY

          for fixture in mismatched missing; do
            if sh "${fixture_root}/${fixture}/validate-production-config.sh" "${valid_env}"; then
              echo "::error::A production preflight elfogadta a ${fixture} migrations image fixture-t."
              exit 1
            fi
          done

      - name: Avatar és CAPTCHA negatív deployment-contract fixture-ek
        shell: bash
        run: |
          set -euo pipefail
          fixture_root=$(mktemp -d)
          trap 'rm -rf "${fixture_root}"' EXIT
          printf '%s\n' \
            'BTPHOTO_IMAGE_TAG=0123456789abcdef0123456789abcdef01234567' \
            'DB_HOST=db.example' 'DB_PORT=26257' 'DB_NAME=btphoto' \
            'DB_USERNAME=btphoto_app' 'DB_PASSWORD=ci-dummy-not-production' > "${fixture_root}/dummy.env"
          for fixture in readonly wrongsource wrongtarget invalidgate missingcaptcha; do
            mkdir -p "${fixture_root}/${fixture}"
            cp deploy/validate-production-config.sh deploy/compose.production.yml "${fixture_root}/${fixture}/"
            python3 - "${fixture_root}/${fixture}/compose.production.yml" "${fixture}" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          case = sys.argv[2]
          if case == "readonly":
              text = text.replace("        read_only: false", "        read_only: true")
          elif case == "wrongsource":
              text = text.replace("/srv/btphoto/media/avatars", "/tmp/ephemeral-avatars")
          elif case == "wrongtarget":
              text = text.replace("        target: /srv/btphoto/avatars", "        target: /srv/btphoto/wrong")
          elif case == "invalidgate":
              text = text.replace("${BTPHOTO_REGISTRATION_ENABLED:-false}", "yes")
          else:
              text = text.replace("${BTPHOTO_REGISTRATION_ENABLED:-false}", '"true"')
          path.write_text(text)
          PY
            if sh "${fixture_root}/${fixture}/validate-production-config.sh" "${fixture_root}/dummy.env"; then
              echo "::error::Hibás avatar/gate fixture elfogadva: ${fixture}"
              exit 1
            fi
          done


      - name: Gateway Caddyfile natív validálása
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp \
            --entrypoint caddy \
            --volume "${GITHUB_WORKSPACE}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Frontend Caddyfile natív validálása
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp \
            --entrypoint caddy \
            --volume "${GITHUB_WORKSPACE}/frontend/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile

  pull-request-image-build:
    name: Pull request image build (${{ matrix.component }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - component: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - component: migrations
            context: ./database
            dockerfile: ./database/Dockerfile
    steps:
      - name: Repository checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Temurin Java 21 beállítása a CockroachDB repository-teszthez
        if: matrix.component == 'migrations'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties

      - name: Docker Buildx beállítása
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Production image ellenőrző build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          pull: true
          load: true
          tags: btphoto-${{ matrix.component }}:ci-${{ github.event.pull_request.head.sha }}
          build-args: |
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
            OCI_REVISION=${{ github.event.pull_request.head.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}

      - name: OCI revision címke ellenőrzése
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
          RUNTIME_IMAGE: btphoto-${{ matrix.component }}:ci-${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual_revision=$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "${RUNTIME_IMAGE}")
          [[ "${actual_revision}" == "${EXPECTED_REVISION}" ]]

      - name: Avatar PNG/JPEG codec a végleges backend JRE-ben
        if: matrix.component == 'backend'
        shell: bash
        env:
          RUNTIME_IMAGE: btphoto-backend:ci-${{ github.event.pull_request.head.sha }}
        run: |
          account_contract=$(docker image inspect --format '{{ index .Config.Labels "hu.btphoto.account-contract" }}' "${RUNTIME_IMAGE}")
          [[ "${account_contract}" == "tenant-v1" ]]
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --user 10001:10001 --memory 128m --entrypoint java \
            "${RUNTIME_IMAGE}" -Djava.awt.headless=true \
            -cp /app/healthcheck AvatarCodecProbe


      - name: Caddy runtime capability regresszió ellenőrzése
        if: matrix.component == 'frontend'
        shell: bash
        env:
          FRONTEND_RUNTIME_IMAGE: btphoto-frontend:ci-${{ github.event.pull_request.head.sha }}
          GATEWAY_RUNTIME_IMAGE: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
        run: |
          set -Eeuo pipefail

          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          frontend_container="btphoto-frontend-cap-${suffix}"
          gateway_container="btphoto-gateway-cap-${suffix}"

          cleanup() {
            docker rm --force \
              "${frontend_container}" \
              "${gateway_container}" \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          wait_for_endpoint() {
            local container_name=$1
            local endpoint=$2

            for _ in $(seq 1 30); do
              if docker exec "${container_name}" \
                wget --no-verbose --tries=1 --spider "${endpoint}" \
                >/dev/null 2>&1; then
                return 0
              fi

              if [[ "$(docker inspect --format '{{.State.Status}}' "${container_name}")" != 'running' ]]; then
                echo "::error::A ${container_name} konténer idő előtt leállt."
                docker inspect --format \
                  'state={{.State.Status}} error={{.State.Error}} exit={{.State.ExitCode}}' \
                  "${container_name}"
                return 1
              fi
              sleep 1
            done

            echo "::error::A ${container_name} konténer végpontja nem vált elérhetővé: ${endpoint}"
            return 1
          }

          docker run --detach \
            --name "${frontend_container}" \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --cap-drop ALL \
            --cap-add NET_BIND_SERVICE \
            --security-opt no-new-privileges:true \
            --user 10001:10001 \
            --env XDG_CONFIG_HOME=/tmp/caddy-config \
            --env XDG_DATA_HOME=/tmp/caddy-data \
            "${FRONTEND_RUNTIME_IMAGE}"
          wait_for_endpoint "${frontend_container}" 'http://127.0.0.1:8080/health'

          docker run --detach \
            --name "${gateway_container}" \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --cap-drop ALL \
            --cap-add NET_BIND_SERVICE \
            --security-opt no-new-privileges:true \
            --user 65534:65534 \
            --env XDG_CONFIG_HOME=/tmp/caddy-config \
            --env XDG_DATA_HOME=/tmp/caddy-data \
            --volume "${GITHUB_WORKSPACE}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "${GATEWAY_RUNTIME_IMAGE}"
          wait_for_endpoint "${gateway_container}" 'http://127.0.0.1:8080/_gateway/health'

      - name: CockroachDB 26.2.2 migrációs kompatibilitás
        if: matrix.component == 'migrations'
        shell: bash
        env:
          COCKROACH_IMAGE: cockroachdb/cockroach:v26.2.2@sha256:abb56e6757d4a73a7059af2911b684f3e13930423fe7bef49fe395669eb14562
          MIGRATIONS_IMAGE: btphoto-migrations:ci-${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail

          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network="btphoto-crdb-${suffix}"
          database_container="btphoto-crdb-${suffix}"
          migration_first="btphoto-migration-first-${suffix}"
          migration_second="btphoto-migration-second-${suffix}"
          migration_invalid="btphoto-migration-invalid-${suffix}"
          fixture_dir="${RUNNER_TEMP}/btphoto-migration-fixture-${suffix}"
          fixture_file="${fixture_dir}/compose.yml"
          fixture_project="btphoto-migration-failure-${suffix}"

          cleanup() {
            if [[ -f "${fixture_file}" ]]; then
              CI_NETWORK="${network}" docker compose \
                --project-name "${fixture_project}" \
                -f "${fixture_file}" \
                down --remove-orphans >/dev/null 2>&1 || true
            fi
            docker rm --force \
              "${migration_first}" \
              "${migration_second}" \
              "${migration_invalid}" \
              "${database_container}" \
              >/dev/null 2>&1 || true
            docker network rm "${network}" >/dev/null 2>&1 || true
            rm -rf "${fixture_dir}"
          }
          trap cleanup EXIT

          docker network create "${network}" >/dev/null
          docker run --detach \
            --name "${database_container}" \
            --label hu.btphoto.fixture=ephemeral-cockroach26 \
            --network "${network}" \
            --publish 127.0.0.1::26257 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --tmpfs /cockroach/cockroach-data:rw,nosuid,nodev,size=512m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --entrypoint /cockroach/cockroach \
            "${COCKROACH_IMAGE}" \
            start-single-node \
            --insecure \
            --listen-addr=0.0.0.0:26257 \
            --advertise-addr="${database_container}:26257" \
            --http-addr=127.0.0.1:8080 \
            --store=/cockroach/cockroach-data \
            --logtostderr=INFO >/dev/null

          database_ready=0
          for _ in $(seq 1 60); do
            if docker exec "${database_container}" \
              cockroach sql --insecure --host=127.0.0.1:26257 \
              --execute 'SELECT 1' >/dev/null 2>&1; then
              database_ready=1
              break
            fi
            sleep 1
          done
          if [[ "${database_ready}" -ne 1 ]]; then
            docker inspect \
              --format 'status={{.State.Status}} running={{.State.Running}} exit_code={{.State.ExitCode}} oom_killed={{.State.OOMKilled}} error={{json .State.Error}} started_at={{.State.StartedAt}} finished_at={{.State.FinishedAt}}' \
              "${database_container}" || true
            docker logs "${database_container}" 2>&1 || true
            echo '::error::A CockroachDB 26.2.2 CI-fixture nem vált elérhetővé a readiness időkorláton belül.'
            exit 1
          fi

          docker exec "${database_container}" \
            cockroach sql --insecure --host=127.0.0.1:26257 --user=root \
            --execute 'CREATE DATABASE btphoto; CREATE USER btphoto_app; GRANT CONNECT ON DATABASE btphoto TO btphoto_app' \
            >/dev/null
          docker exec "${database_container}" \
            cockroach sql --insecure --host=127.0.0.1:26257 --user=root --database=btphoto \
            --execute 'REVOKE CREATE ON SCHEMA public FROM public; GRANT USAGE, CREATE ON SCHEMA public TO btphoto_app' \
            >/dev/null

          if ! docker exec "${database_container}" \
            cockroach sql --insecure --host=127.0.0.1:26257 --user=root \
            --format=csv \
            --execute 'SHOW ROLES' \
            | python3 -c '
          import csv
          import sys

          reader = csv.DictReader(sys.stdin)
          required_columns = {"username", "member_of"}
          if reader.fieldnames is None or not required_columns.issubset(reader.fieldnames):
              print("::error::A SHOW ROLES CSV-kimenetéből hiányzik a username vagy member_of oszlop.", file=sys.stderr)
              raise SystemExit(1)

          matches = [row for row in reader if row.get("username") == "btphoto_app"]
          if len(matches) != 1:
              print(f"::error::A SHOW ROLES kimenetében pontosan egy btphoto_app sor helyett {len(matches)} található.", file=sys.stderr)
              raise SystemExit(1)

          member_of = (matches[0].get("member_of") or "").strip()
          if member_of != "{}":
              print("::error::A btphoto_app váratlan szerepkör-tagsággal rendelkezik; a member_of érték nem üres.", file=sys.stderr)
              raise SystemExit(1)
          '; then
            echo '::error::A btphoto_app SHOW ROLES alapú legkisebb jogosultság-ellenőrzése sikertelen.'
            exit 1
          fi

          application_identity=$(docker exec "${database_container}" \
            cockroach sql --insecure --host=127.0.0.1:26257 --user=btphoto_app --database=btphoto \
            --format=csv \
            --execute 'SELECT current_user, current_database()' \
            | tail -n 1 | tr -d '\r')
          [[ "${application_identity}" == "btphoto_app,btphoto" ]]

          run_migration() {
            local container_name=$1
            local jdbc_url=$2

            docker run --name "${container_name}" \
              --network "${network}" \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --user 10001:10001 \
              --env HOME=/tmp \
              --env "FLYWAY_URL=${jdbc_url}" \
              --env FLYWAY_USER=btphoto_app \
              --env FLYWAY_PASSWORD= \
              --env FLYWAY_LOCATIONS=filesystem:/flyway/sql \
              --env FLYWAY_CONNECT_RETRIES=0 \
              "${MIGRATIONS_IMAGE}"
          }

          jdbc_url="jdbc:postgresql://${database_container}:26257/btphoto?sslmode=disable"
          run_migration "${migration_first}" "${jdbc_url}"
          run_migration "${migration_second}" "${jdbc_url}"

          history_count=$(docker exec "${database_container}" \
            cockroach sql --insecure --host=127.0.0.1:26257 --user=btphoto_app --database=btphoto \
            --format=csv \
            --execute "SELECT count(*) FROM public.flyway_schema_history WHERE version IN ('1', '2', '3') AND success" \
            | tail -n 1 | tr -d '\r')
          [[ "${history_count}" == "3" ]]

          public_table_count=$(docker exec "${database_container}" \
            cockroach sql --insecure --host=127.0.0.1:26257 --user=btphoto_app --database=btphoto \
            --format=csv \
            --execute "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'" \
            | tail -n 1 | tr -d '\r')
          [[ "${public_table_count}" == "6" ]]

          admin_column_count=$(docker exec "${database_container}" \
            cockroach sql --insecure --host=127.0.0.1:26257 --user=btphoto_app --database=btphoto \
            --format=csv \
            --execute "SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'admin_user'" \
            | tail -n 1 | tr -d '\r')
          [[ "${admin_column_count}" == "10" ]]

          database_host_port=$(docker inspect \
            --format '{{(index (index .NetworkSettings.Ports "26257/tcp") 0).HostPort}}' \
            "${database_container}")
          chmod +x backend/mvnw
          BTPHOTO_TEST_JDBC_URL="jdbc:postgresql://127.0.0.1:${database_host_port}/btphoto?sslmode=disable" \
          BTPHOTO_TEST_DB_USERNAME=btphoto_app \
          BTPHOTO_TEST_FIXTURE=ephemeral-cockroach26 \
          BTPHOTO_TEST_DB_PASSWORD='' \
            ./backend/mvnw -B -ntp -f backend/pom.xml \
              -Dtest=AdminUserRepositoryCockroachTest,AccountRepositoryCockroachTest test

          if run_migration "${migration_invalid}" \
            'jdbc:postgresql://missing-cockroach.invalid:26257/btphoto?sslmode=disable'; then
            echo '::error::A migrations image hibás kapcsolati adatokkal is sikeres lett.'
            exit 1
          fi

          mkdir -p "${fixture_dir}"
          cat >"${fixture_file}" <<'YAML'
          services:
            migrations:
              image: ${MIGRATIONS_IMAGE}
              user: "10001:10001"
              environment:
                HOME: /tmp
                FLYWAY_URL: jdbc:postgresql://missing-cockroach.invalid:26257/btphoto?sslmode=disable
                FLYWAY_USER: btphoto_app
                FLYWAY_PASSWORD: ""
                FLYWAY_LOCATIONS: filesystem:/flyway/sql
                FLYWAY_CONNECT_RETRIES: "0"
              networks:
                - integration
              read_only: true
              tmpfs:
                - /tmp:rw,noexec,nosuid,nodev,size=32m
              cap_drop:
                - ALL
              security_opt:
                - no-new-privileges:true
            backend-probe:
              image: ${MIGRATIONS_IMAGE}
              entrypoint:
                - /bin/sh
                - -c
              command:
                - printf backend-started
              depends_on:
                migrations:
                  condition: service_completed_successfully
              networks:
                - integration
          networks:
            integration:
              external: true
              name: ${CI_NETWORK}
          YAML

          export MIGRATIONS_IMAGE CI_NETWORK="${network}"
          if docker compose \
            --project-name "${fixture_project}" \
            -f "${fixture_file}" \
            up --abort-on-container-exit; then
            echo '::error::A hibás migrációs fixture váratlanul sikeres lett.'
            exit 1
          fi

          backend_probe_id=$(docker compose \
            --project-name "${fixture_project}" \
            -f "${fixture_file}" \
            ps --all -q backend-probe || true)
          if [[ -n "${backend_probe_id}" ]]; then
            backend_probe_state=$(docker inspect --format '{{.State.Status}}' "${backend_probe_id}")
            [[ "${backend_probe_state}" == "created" ]]
          fi

  publish-main-images:
    name: Publish main image (${{ matrix.component }})
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: ghcr.io/balintbotond89/btphoto-backend
          - component: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: ghcr.io/balintbotond89/btphoto-frontend
          - component: migrations
            context: ./database
            dockerfile: ./database/Dockerfile
            image: ghcr.io/balintbotond89/btphoto-migrations
    steps:
      - name: Quality CI által ellenőrzött commit checkoutja
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Docker Buildx beállítása
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Bejelentkezés a GHCR-be
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Production image build és publikálás
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          pull: true
          tags: ${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
          build-args: |
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
            OCI_REVISION=${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
