spring:
  application:
    name: btphoto-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

server:
  servlet:
    session:
      timeout: 30m
      tracking-modes:
        - cookie
      cookie:
        name: BTPHOTO_SESSION
        http-only: true
        same-site: lax

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health

btphoto:
  recaptcha:
    site-key: ${BTPHOTO_RECAPTCHA_SITE_KEY:}
    secret: ${BTPHOTO_RECAPTCHA_SECRET:}
    hostnames: ${BTPHOTO_RECAPTCHA_HOSTNAMES:}
  registration:
    enabled: ${BTPHOTO_REGISTRATION_ENABLED:false}
    trusted-gateway: ${BTPHOTO_TRUSTED_GATEWAY:}
  avatar:
    root: ${BTPHOTO_AVATAR_ROOT:}
    require-nfs: true
