spring:
  application:
    name: btphoto-backend

server:
  servlet:
    session:
      timeout: 30m
      tracking-modes:
        - cookie
      cookie:
        name: BTPHOTO_SESSION
        http-only: true
        same-site: lax

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
